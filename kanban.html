<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0A0A0F">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kanban">
<title>Kanban — Tasks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --green:#00D4AA;--red:#FF4D6D;--amber:#FFB020;--blue:#4D9FFF;
  --purple:#A78BFA;--dark:#0A0A0F;--card:#12121A;--panel:#1A1A28;
  --border:#1E1E2E;--text:#E8E8F0;--muted:#6B6B8A;
  --font-head:'Syne',sans-serif;--font-mono:'DM Mono',monospace;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--dark);color:var(--text);font-family:var(--font-mono);overflow:hidden}
#app{display:flex;flex-direction:column;height:100dvh}

.hdr{display:flex;align-items:center;justify-content:space-between;padding:14px 20px 10px;padding-top:calc(14px + env(safe-area-inset-top));flex-shrink:0}
.hdr h1{font-family:var(--font-head);font-size:22px;letter-spacing:3px}
.hdr-sub{font-size:10px;color:var(--muted);letter-spacing:1.5px;margin-top:2px}

#board{flex:1;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;padding:8px 16px 16px;overflow:hidden;min-height:0}
@media (max-width:900px){
  #board{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:85%;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;padding-bottom:90px}
  #board>.kcol{scroll-snap-align:start}
}

.kcol{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--border);border-radius:14px;min-height:0;transition:border-color .15s,background .15s}
.kcol.over{border-color:var(--green);background:color-mix(in srgb,var(--green) 6%,var(--card))}

.kcol-hdr{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--border);flex-shrink:0}
.kcol-title{font-family:var(--font-head);font-size:13px;font-weight:800;letter-spacing:2px}
.kcol-meta{display:flex;align-items:center;gap:8px}
.kcol-count{font-size:11px;color:var(--muted);font-weight:700;background:var(--panel);border-radius:10px;padding:2px 8px;min-width:24px;text-align:center}
.kcol-add{background:none;border:none;color:var(--muted);cursor:pointer;padding:2px 4px;font-family:var(--font-mono);font-size:18px;line-height:1;transition:color .15s}
.kcol-add:hover{color:var(--green)}

.kcol-body{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:60px}
.kcol-body::-webkit-scrollbar{width:6px}
.kcol-body::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

.kcol-empty{border:1px dashed var(--border);border-radius:10px;padding:18px 10px;text-align:center;font-size:11px;color:var(--muted);letter-spacing:1px}

.kcard{position:relative;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:10px 12px 10px 16px;cursor:grab;touch-action:none;user-select:none;animation:fadeUp .2s ease}
.kcard:active{cursor:grabbing}
.kcard.kcard-dragging{opacity:.3}
.kcard-stripe{position:absolute;left:0;top:0;bottom:0;width:4px;border-radius:10px 0 0 10px}
.kcard-stripe.p-urgent{background:var(--red)}
.kcard-stripe.p-high  {background:var(--amber)}
.kcard-stripe.p-medium{background:var(--blue)}
.kcard-stripe.p-low   {background:var(--muted)}
.kcard-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.kcard-title{font-size:13px;font-weight:600;line-height:1.35;word-break:break-word;flex:1}
.kcard-desc{font-size:11px;color:var(--muted);margin-top:5px;line-height:1.4;word-break:break-word;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

.badge{display:inline-flex;align-items:center;gap:4px;border-radius:20px;padding:2px 7px;font-size:9px;font-weight:700;letter-spacing:1px;flex-shrink:0}
.badge-red   {background:color-mix(in srgb,var(--red)   15%,transparent);border:1px solid var(--red);   color:var(--red)}
.badge-amber {background:color-mix(in srgb,var(--amber) 15%,transparent);border:1px solid var(--amber); color:var(--amber)}
.badge-blue  {background:color-mix(in srgb,var(--blue)  15%,transparent);border:1px solid var(--blue);  color:var(--blue)}
.badge-muted {background:color-mix(in srgb,var(--muted) 15%,transparent);border:1px solid var(--muted); color:var(--muted)}

.kcard-ghost{position:fixed;top:0;left:0;width:240px;pointer-events:none;opacity:.9;transform:rotate(2deg);z-index:300;box-shadow:0 12px 40px #000a}

.fab{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;background:var(--green);color:var(--dark);border:none;font-size:32px;font-weight:300;line-height:1;cursor:pointer;box-shadow:0 8px 24px color-mix(in srgb,var(--green) 40%,transparent);z-index:90;display:flex;align-items:center;justify-content:center;padding-bottom:4px}
.fab:active{opacity:.8}

.overlay{display:none;position:fixed;inset:0;background:#000a;z-index:200;align-items:flex-end;justify-content:center}
.overlay.open{display:flex}
.sheet{background:var(--card);border-radius:24px 24px 0 0;width:100%;max-width:560px;max-height:92dvh;overflow-y:auto;padding:24px 24px calc(24px + env(safe-area-inset-bottom));animation:slideUp .25s ease}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

.sheet-hdr{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px;gap:12px}
.sheet-hdr h2{font-family:var(--font-head);font-size:20px;font-weight:800;flex:1;letter-spacing:1px}
.close-btn{background:none;border:none;color:var(--muted);cursor:pointer;padding:4px;flex-shrink:0;font-size:22px;line-height:1;font-family:var(--font-mono)}

.sec-label{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:1px;margin:14px 0 8px}

.field{margin-bottom:12px}
.field label{display:block;font-size:10px;color:var(--muted);font-weight:700;letter-spacing:1px;margin-bottom:6px}
.field label .req{color:var(--red)}
.input,.textarea{width:100%;background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:10px;padding:11px 14px;font-size:14px;font-family:var(--font-mono);outline:none;transition:border-color .15s}
.input:focus,.textarea:focus{border-color:var(--green)}
.input.err{border-color:var(--red)!important;animation:shake .3s ease}
.input::placeholder,.textarea::placeholder{color:var(--muted)}
.textarea{resize:vertical;min-height:70px;line-height:1.45}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

.pri-row,.status-row{display:flex;gap:8px;flex-wrap:wrap}
.pri-pill,.status-pill{flex:1;min-width:60px;text-align:center;padding:10px 6px;border-radius:10px;border:1px solid var(--border);background:var(--panel);color:var(--muted);cursor:pointer;font-family:var(--font-mono);font-size:10px;font-weight:700;letter-spacing:1px;transition:all .15s}
.pri-pill.sel.p-urgent{border-color:var(--red);   color:var(--red);   background:color-mix(in srgb,var(--red)   15%,transparent)}
.pri-pill.sel.p-high  {border-color:var(--amber); color:var(--amber); background:color-mix(in srgb,var(--amber) 15%,transparent)}
.pri-pill.sel.p-medium{border-color:var(--blue);  color:var(--blue);  background:color-mix(in srgb,var(--blue)  15%,transparent)}
.pri-pill.sel.p-low   {border-color:var(--muted); color:var(--text);  background:color-mix(in srgb,var(--muted) 15%,transparent)}
.status-pill.sel{border-color:var(--green);color:var(--green);background:color-mix(in srgb,var(--green) 12%,transparent)}

.btn{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;padding:13px;font-size:13px;font-weight:800;cursor:pointer;border:none;font-family:var(--font-mono);letter-spacing:.5px;min-width:90px;transition:opacity .15s}
.btn:active{opacity:.75}
.btn[disabled]{opacity:.35;cursor:not-allowed}
.btn-green {background:var(--green);color:var(--dark)}
.btn-red   {background:color-mix(in srgb,var(--red) 15%,transparent);border:1px solid var(--red);color:var(--red)}
.btn-ghost {background:var(--panel);color:var(--text);border:1px solid var(--border)}
.btn-full  {width:100%;flex:none}
.action-row{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}

.detail-row{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--border);gap:12px}
.detail-row .dl{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:1px;flex-shrink:0}
.detail-row .dv{font-size:13px;text-align:right;word-break:break-word}
.detail-desc{font-size:13px;color:var(--text);line-height:1.5;padding:10px 0;white-space:pre-wrap;word-break:break-word}

.move-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}

.link-row{display:flex;align-items:center;gap:6px;font-size:10px;color:var(--muted);letter-spacing:1px}
.link-row a{color:var(--green);text-decoration:none}
</style>
</head>
<body>
<div id="app">
  <div class="hdr">
    <div>
      <h1>KANBAN</h1>
      <div class="hdr-sub">TASKS · PRIORITIZED</div>
    </div>
    <div class="link-row"><a href="index.html">↪ MyStuff</a></div>
  </div>

  <div id="board">
    <div class="kcol" data-status="backlog">
      <div class="kcol-hdr">
        <div class="kcol-title">BACKLOG</div>
        <div class="kcol-meta"><span class="kcol-count">0</span><button class="kcol-add" data-add="backlog" aria-label="Add to Backlog">+</button></div>
      </div>
      <div class="kcol-body"></div>
    </div>
    <div class="kcol" data-status="todo">
      <div class="kcol-hdr">
        <div class="kcol-title">TO DO</div>
        <div class="kcol-meta"><span class="kcol-count">0</span><button class="kcol-add" data-add="todo" aria-label="Add to To Do">+</button></div>
      </div>
      <div class="kcol-body"></div>
    </div>
    <div class="kcol" data-status="doing">
      <div class="kcol-hdr">
        <div class="kcol-title">DOING</div>
        <div class="kcol-meta"><span class="kcol-count">0</span><button class="kcol-add" data-add="doing" aria-label="Add to Doing">+</button></div>
      </div>
      <div class="kcol-body"></div>
    </div>
    <div class="kcol" data-status="done">
      <div class="kcol-hdr">
        <div class="kcol-title">DONE</div>
        <div class="kcol-meta"><span class="kcol-count">0</span><button class="kcol-add" data-add="done" aria-label="Add to Done">+</button></div>
      </div>
      <div class="kcol-body"></div>
    </div>
  </div>
</div>

<button class="fab" id="fab" aria-label="Add task">+</button>

<div class="overlay" id="editSheet">
  <div class="sheet">
    <div class="sheet-hdr">
      <h2 id="editTitle">NEW TASK</h2>
      <button class="close-btn" data-close="editSheet" aria-label="Close">✕</button>
    </div>
    <div class="field">
      <label>TITLE <span class="req">*</span></label>
      <input class="input" id="f-title" maxlength="120" autocomplete="off" placeholder="What needs to be done?">
    </div>
    <div class="field">
      <label>DESCRIPTION</label>
      <textarea class="textarea" id="f-desc" maxlength="600" placeholder="Optional details, notes, links…"></textarea>
    </div>
    <div class="field">
      <label>PRIORITY</label>
      <div class="pri-row" id="f-pri">
        <button type="button" class="pri-pill p-urgent" data-pri="urgent">URGENT</button>
        <button type="button" class="pri-pill p-high"   data-pri="high">HIGH</button>
        <button type="button" class="pri-pill p-medium" data-pri="medium">MEDIUM</button>
        <button type="button" class="pri-pill p-low"    data-pri="low">LOW</button>
      </div>
    </div>
    <div class="field">
      <label>COLUMN</label>
      <div class="status-row" id="f-status">
        <button type="button" class="status-pill" data-status="backlog">BACKLOG</button>
        <button type="button" class="status-pill" data-status="todo">TO DO</button>
        <button type="button" class="status-pill" data-status="doing">DOING</button>
        <button type="button" class="status-pill" data-status="done">DONE</button>
      </div>
    </div>
    <div class="action-row">
      <button class="btn btn-ghost" data-close="editSheet">CANCEL</button>
      <button class="btn btn-green" id="saveBtn">SAVE</button>
    </div>
  </div>
</div>

<div class="overlay" id="cardSheet">
  <div class="sheet">
    <div class="sheet-hdr">
      <h2 id="cardTitle">TASK</h2>
      <button class="close-btn" data-close="cardSheet" aria-label="Close">✕</button>
    </div>
    <div id="cardBody"></div>
    <div class="sec-label">MOVE TO</div>
    <div class="move-grid" id="moveGrid">
      <button class="btn btn-ghost" data-move="backlog">BACKLOG</button>
      <button class="btn btn-ghost" data-move="todo">TO DO</button>
      <button class="btn btn-ghost" data-move="doing">DOING</button>
      <button class="btn btn-ghost" data-move="done">DONE</button>
    </div>
    <div class="action-row">
      <button class="btn btn-ghost" id="editBtn">EDIT</button>
      <button class="btn btn-red"   id="deleteBtn">DELETE</button>
    </div>
  </div>
</div>

<script>
'use strict';

const STORAGE_KEY = 'kanban_tasks_v1';
const COLUMNS = [
  {status:'backlog', label:'BACKLOG'},
  {status:'todo',    label:'TO DO'},
  {status:'doing',   label:'DOING'},
  {status:'done',    label:'DONE'},
];
const PRI = {urgent:4, high:3, medium:2, low:1};
const PRI_LABEL = {urgent:'URGENT', high:'HIGH', medium:'MEDIUM', low:'LOW'};
const PRI_BADGE = {urgent:'badge-red', high:'badge-amber', medium:'badge-blue', low:'badge-muted'};

const state = {
  tasks: [],
  editingId: null,
  sheetCardId: null,
  formPriority: 'medium',
  formStatus: 'backlog',
};

function esc(s){
  return String(s ?? '').replace(/[&<>"']/g, c => (
    {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]
  ));
}
function genId(){
  return 'k_' + Date.now() + '_' + Math.random().toString(36).slice(2,7);
}

function loadTasks(){
  const raw = localStorage.getItem(STORAGE_KEY);
  if(!raw) return [];
  try{
    const arr = JSON.parse(raw);
    return Array.isArray(arr) ? arr : [];
  }catch(err){
    const backup = STORAGE_KEY + '_corrupt_' + Date.now();
    try{ localStorage.setItem(backup, raw); }catch(_){}
    localStorage.removeItem(STORAGE_KEY);
    console.warn('Corrupt kanban data backed up to', backup);
    return [];
  }
}
function saveTasks(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state.tasks));
}

function sortTasks(a, b){
  const p = PRI[b.priority] - PRI[a.priority];
  return p || (a.createdAt - b.createdAt);
}

function cardHTML(t){
  const showBadge = t.priority === 'urgent' || t.priority === 'high';
  return `<div class="kcard" data-id="${t.id}">
    <div class="kcard-stripe p-${t.priority}"></div>
    <div class="kcard-top">
      <div class="kcard-title">${esc(t.title)}</div>
      ${showBadge ? `<span class="badge ${PRI_BADGE[t.priority]}">${PRI_LABEL[t.priority]}</span>` : ''}
    </div>
    ${t.description ? `<div class="kcard-desc">${esc(t.description)}</div>` : ''}
  </div>`;
}

function renderBoard(){
  for(const col of COLUMNS){
    const colEl = document.querySelector(`.kcol[data-status="${col.status}"]`);
    const body = colEl.querySelector('.kcol-body');
    const countEl = colEl.querySelector('.kcol-count');
    const cards = state.tasks.filter(t => t.status === col.status).sort(sortTasks);
    body.innerHTML = cards.length
      ? cards.map(cardHTML).join('')
      : `<div class="kcol-empty">Drop tasks here</div>`;
    countEl.textContent = cards.length;
  }
}

function findTask(id){
  return state.tasks.find(t => t.id === id);
}

function moveTask(id, toStatus){
  const t = findTask(id);
  if(!t || t.status === toStatus) return;
  t.status = toStatus;
  t.updatedAt = Date.now();
  if(toStatus === 'done') t.completedAt = Date.now();
  else if(t.completedAt) t.completedAt = null;
  saveTasks();
  renderBoard();
}

function deleteTask(id){
  state.tasks = state.tasks.filter(t => t.id !== id);
  saveTasks();
  renderBoard();
}

// ── Pointer-events drag controller ───────────────────────────────────────────
const DRAG_THRESHOLD = 5;
const TAP_MAX_MS = 350;
let drag = null;

function onPointerDown(e){
  if(e.button !== undefined && e.button !== 0) return;
  const cardEl = e.target.closest('.kcard');
  if(!cardEl) return;
  const id = cardEl.dataset.id;
  drag = {
    id, cardEl, ghost: null,
    startX: e.clientX, startY: e.clientY,
    startT: Date.now(), moved: false,
    pointerId: e.pointerId,
  };
  window.addEventListener('pointermove', onPointerMove);
  window.addEventListener('pointerup',   onPointerUp);
  window.addEventListener('pointercancel', onPointerUp);
}
function onPointerMove(e){
  if(!drag) return;
  const dx = e.clientX - drag.startX, dy = e.clientY - drag.startY;
  if(!drag.moved){
    if(Math.hypot(dx, dy) < DRAG_THRESHOLD) return;
    drag.moved = true;
    drag.ghost = drag.cardEl.cloneNode(true);
    drag.ghost.classList.add('kcard-ghost');
    drag.ghost.style.width = drag.cardEl.offsetWidth + 'px';
    document.body.appendChild(drag.ghost);
    drag.cardEl.classList.add('kcard-dragging');
  }
  drag.ghost.style.transform =
    `translate(${e.clientX - 30}px, ${e.clientY - 18}px) rotate(2deg)`;
  const under = document.elementFromPoint(e.clientX, e.clientY);
  const targetCol = under && under.closest('.kcol');
  document.querySelectorAll('.kcol.over').forEach(c => {
    if(c !== targetCol) c.classList.remove('over');
  });
  if(targetCol) targetCol.classList.add('over');
}
function onPointerUp(e){
  window.removeEventListener('pointermove', onPointerMove);
  window.removeEventListener('pointerup',   onPointerUp);
  window.removeEventListener('pointercancel', onPointerUp);
  if(!drag) return;
  const d = drag; drag = null;
  if(d.moved){
    const under = document.elementFromPoint(e.clientX, e.clientY);
    const targetCol = under && under.closest('.kcol');
    if(d.ghost) d.ghost.remove();
    d.cardEl.classList.remove('kcard-dragging');
    document.querySelectorAll('.kcol.over').forEach(c => c.classList.remove('over'));
    if(targetCol) moveTask(d.id, targetCol.dataset.status);
  }else if(Date.now() - d.startT < TAP_MAX_MS){
    openCardSheet(d.id);
  }
}

// ── Edit / Add sheet ─────────────────────────────────────────────────────────
function openEditSheet(opts){
  opts = opts || {};
  const existing = opts.id ? findTask(opts.id) : null;
  state.editingId = existing ? existing.id : null;
  document.getElementById('editTitle').textContent = existing ? 'EDIT TASK' : 'NEW TASK';
  document.getElementById('f-title').value = existing ? existing.title : '';
  document.getElementById('f-desc').value  = existing ? (existing.description || '') : '';
  state.formPriority = existing ? existing.priority : 'medium';
  state.formStatus   = existing ? existing.status   : (opts.status || 'backlog');
  syncPriPills();
  syncStatusPills();
  openOverlay('editSheet');
  setTimeout(() => document.getElementById('f-title').focus(), 50);
}
function syncPriPills(){
  document.querySelectorAll('#f-pri .pri-pill').forEach(p => {
    p.classList.toggle('sel', p.dataset.pri === state.formPriority);
  });
}
function syncStatusPills(){
  document.querySelectorAll('#f-status .status-pill').forEach(p => {
    p.classList.toggle('sel', p.dataset.status === state.formStatus);
  });
}
function saveFromForm(){
  const titleEl = document.getElementById('f-title');
  const title = titleEl.value.trim();
  if(!title){
    titleEl.classList.add('err');
    setTimeout(() => titleEl.classList.remove('err'), 350);
    titleEl.focus();
    return;
  }
  const desc = document.getElementById('f-desc').value.trim();
  const now = Date.now();
  if(state.editingId){
    const t = findTask(state.editingId);
    if(!t) return;
    const wasDone = t.status === 'done';
    t.title = title;
    t.description = desc;
    t.priority = state.formPriority;
    t.status = state.formStatus;
    t.updatedAt = now;
    if(t.status === 'done' && !wasDone) t.completedAt = now;
    if(t.status !== 'done') t.completedAt = null;
  }else{
    state.tasks.push({
      id: genId(),
      title, description: desc,
      priority: state.formPriority,
      status: state.formStatus,
      createdAt: now, updatedAt: now,
      completedAt: state.formStatus === 'done' ? now : null,
    });
  }
  saveTasks();
  renderBoard();
  closeOverlay('editSheet');
}

// ── Card detail / move sheet ─────────────────────────────────────────────────
function openCardSheet(id){
  const t = findTask(id);
  if(!t) return;
  state.sheetCardId = id;
  document.getElementById('cardTitle').textContent = t.title.toUpperCase();
  const colLabel = COLUMNS.find(c => c.status === t.status).label;
  const body = document.getElementById('cardBody');
  body.innerHTML = `
    <div class="detail-row"><span class="dl">PRIORITY</span>
      <span class="dv"><span class="badge ${PRI_BADGE[t.priority]}">${PRI_LABEL[t.priority]}</span></span></div>
    <div class="detail-row"><span class="dl">COLUMN</span><span class="dv">${colLabel}</span></div>
    <div class="detail-row"><span class="dl">CREATED</span><span class="dv">${new Date(t.createdAt).toLocaleString()}</span></div>
    ${t.completedAt ? `<div class="detail-row"><span class="dl">COMPLETED</span><span class="dv">${new Date(t.completedAt).toLocaleString()}</span></div>` : ''}
    ${t.description ? `<div class="sec-label">DESCRIPTION</div><div class="detail-desc">${esc(t.description)}</div>` : ''}
  `;
  document.querySelectorAll('#moveGrid .btn').forEach(b => {
    b.disabled = b.dataset.move === t.status;
  });
  openOverlay('cardSheet');
}

// ── Overlay helpers ──────────────────────────────────────────────────────────
function openOverlay(id){
  document.getElementById(id).classList.add('open');
}
function closeOverlay(id){
  document.getElementById(id).classList.remove('open');
  if(id === 'editSheet') state.editingId = null;
  if(id === 'cardSheet') state.sheetCardId = null;
}

// ── Init / event wiring ──────────────────────────────────────────────────────
function init(){
  state.tasks = loadTasks();
  renderBoard();

  // Delegated pointerdown on board for card drag/tap
  document.getElementById('board').addEventListener('pointerdown', onPointerDown);

  // FAB
  document.getElementById('fab').addEventListener('click', () => openEditSheet({}));

  // Per-column "+"
  document.querySelectorAll('.kcol-add').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      openEditSheet({status: btn.dataset.add});
    });
  });

  // Overlay close buttons + backdrop click
  document.querySelectorAll('[data-close]').forEach(el => {
    el.addEventListener('click', () => closeOverlay(el.dataset.close));
  });
  document.querySelectorAll('.overlay').forEach(ov => {
    ov.addEventListener('click', e => {
      if(e.target === ov) closeOverlay(ov.id);
    });
  });

  // Priority + status pills
  document.querySelectorAll('#f-pri .pri-pill').forEach(p => {
    p.addEventListener('click', () => { state.formPriority = p.dataset.pri; syncPriPills(); });
  });
  document.querySelectorAll('#f-status .status-pill').forEach(p => {
    p.addEventListener('click', () => { state.formStatus = p.dataset.status; syncStatusPills(); });
  });

  // Save
  document.getElementById('saveBtn').addEventListener('click', saveFromForm);
  document.getElementById('f-title').addEventListener('keydown', e => {
    if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); saveFromForm(); }
  });

  // Card sheet actions
  document.querySelectorAll('#moveGrid .btn').forEach(b => {
    b.addEventListener('click', () => {
      if(state.sheetCardId){
        moveTask(state.sheetCardId, b.dataset.move);
        closeOverlay('cardSheet');
      }
    });
  });
  document.getElementById('editBtn').addEventListener('click', () => {
    const id = state.sheetCardId;
    closeOverlay('cardSheet');
    if(id) openEditSheet({id});
  });
  document.getElementById('deleteBtn').addEventListener('click', () => {
    const id = state.sheetCardId;
    if(!id) return;
    if(confirm('Delete this task?')){
      deleteTask(id);
      closeOverlay('cardSheet');
    }
  });

  // ESC closes any overlay
  document.addEventListener('keydown', e => {
    if(e.key === 'Escape'){
      document.querySelectorAll('.overlay.open').forEach(o => closeOverlay(o.id));
    }
  });
}

init();
</script>
</body>
</html>
